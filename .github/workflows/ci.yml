name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # No schedule: the stack builds use fixed snapshots and lock files, so a
  # scheduled run would build the same dependencies each time. The cabal
  # workflow runs weekly against the current Hackage index instead.
  workflow_dispatch:

# Nothing in this workflow writes to the repository, so the token is read-only
# and checkouts don't keep it.
permissions:
  contents: read

# If updates are pushed to a branch, cancel in-progress runs. Manual runs get
# their own group, so they neither cancel nor are cancelled by a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check for stack YAML files
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: generate
        uses: freckle/stack-action/generate-matrix@454226a86f7e22e21387ab950cdecaa865365425 # v5.7.31
    outputs:
      stack-yamls: ${{ steps.generate.outputs.stack-yamls }}

  test:
    needs: generate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        stack-yaml: ${{ fromJSON(needs.generate.outputs.stack-yamls) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y memcached
      - id: stack
        uses: freckle/stack-action@454226a86f7e22e21387ab950cdecaa865365425 # v5.7.31
        with:
          stack-yaml: ${{ matrix.stack-yaml }}
          # Replaces the default "--fast --pedantic"; also build the benchmark.
          stack-build-arguments: --fast --pedantic --bench --no-run-benchmarks

      - if: ${{ matrix.stack-yaml == 'stack.yaml' }}
        uses: freckle/weeder-action@fc4ae04b473960ab78b14fdb01d6e235a8b62767 # v3.0.14
        with:
          ghc-version: ${{ steps.stack.outputs.compiler-version }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2.4.10
        with:
          version: "3.10"
      - uses: haskell-actions/hlint-run@eaca4cfbf4a69f4eb875df38b6bc3e1657020378 # v2.4.10
        with:
          fail-on: warning
