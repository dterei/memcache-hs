name: memcache
version: 0.4.0.0
github: dterei/memcache-hs
synopsis: A memcached client library.
description: A buffered Meta Text protocol client for single servers and clusters.
license: BSD3
license-file: LICENSE
author: David Terei <code@davidterei.com>
maintainer: David Terei <code@davidterei.com>
copyright: 2012-2026 David Terei.
category: Database
build-type: Simple
extra-doc-files:
  - README.md
  - CHANGELOG.md
  - TODO.md
extra-source-files:
  - package.yaml

dependencies:
  - base >= 4.16 && < 5
  - base64-bytestring >= 1.2.1.0
  - bytestring >= 0.11.4.0
  - network >= 3.1.4.0
  - time >= 1.11.1.1

other-extensions:
  - BangPatterns
  - CPP

library:
  source-dirs: .
  dependencies:
    - data-default >= 0.7.1.1
    - errors >= 2.3.0
    - hashable >= 1.4.2.0
    - network-uri >= 2.6.4.2
    - resource-pool >= 0.2.3.2
    - text >= 1.2.5.0
    - unliftio >= 0.2.25.0
    - vector >= 0.12.3.1
  other-modules:
    - Database.Memcache.Types.Authentication
    - Database.Memcache.Types.ServerSpec
  other-extensions:
    - DeriveDataTypeable
    - FlexibleInstances
    - RecordWildCards
    - ScopedTypeVariables
  ghc-options:
    - -Wall
    - -Wextra
    - -fwarn-tabs

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -Wall
      - -Wextra
      - -threaded
      - -rtsopts "-with-rtsopts=-N"
    other-extensions:
      - OverloadedStrings
    other-modules:
      - MockServer
    dependencies:
      - memcache
      - hspec
      - network
      - unliftio

  integration:
    main: Integration.hs
    source-dirs: test-integration
    ghc-options:
      - -Wall
      - -Wextra
      - -threaded
      - -rtsopts "-with-rtsopts=-N"
    other-extensions:
      - OverloadedStrings
    dependencies:
      - memcache
      - directory
      - hspec
      - network
      - process
      - time

benchmarks:
  parser:
    main: Parser.hs
    source-dirs: bench
    other-extensions:
      - OverloadedStrings
    dependencies:
      - memcache
      - criterion
