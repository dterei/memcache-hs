name: memcache
version: 0.4.0.0
github: dterei/memcache-hs
synopsis: A memcached client library.
description: A buffered Meta Text protocol client for single servers and clusters.
license: BSD3
license-file: LICENSE
author: David Terei <code@davidterei.com>
maintainer: David Terei <code@davidterei.com>
copyright: 2016 David Terei.
category: Database
build-type: Simple
extra-doc-files:
  - README.md
  - CHANGELOG.md
  - TODO.md
extra-source-files:
  - package.yaml

dependencies:
  - base < 5
  - base64-bytestring
  - bytestring
  - network
  - time

other-extensions:
  - BangPatterns
  - CPP

library:
  source-dirs: .
  dependencies:
    - data-default-class
    - errors
    - hashable
    - network-uri
    - resource-pool
    - text
    - time
    - unliftio
    - vector
  other-modules:
    - Database.Memcache.Types.Authentication
    - Database.Memcache.Types.ServerSpec
  other-extensions:
    - DeriveDataTypeable
    - FlexibleInstances
    - RecordWildCards
    - ScopedTypeVariables
  ghc-options:
    - -Wall
    - -Wextra
    - -fwarn-tabs

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -Wall
      - -Wextra
      - -threaded
      - -rtsopts "-with-rtsopts=-N"
    other-extensions:
      - OverloadedStrings
    other-modules:
      - MockServer
    dependencies:
      - memcache
      - hspec
      - network
      - unliftio

  integration:
    main: Integration.hs
    source-dirs: test-integration
    ghc-options:
      - -Wall
      - -Wextra
      - -threaded
      - -rtsopts "-with-rtsopts=-N"
    other-extensions:
      - OverloadedStrings
    dependencies:
      - memcache
      - directory
      - hspec
      - network
      - process
      - time

benchmarks:
  parser:
    main: Parser.hs
    source-dirs: bench
    other-extensions:
      - OverloadedStrings
    dependencies:
      - memcache
      - criterion
